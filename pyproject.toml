[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fpl-recommendation-bot"
version = "0.1.0"
description = "A conservative, recommendation-only Fantasy Premier League Telegram bot."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FPL Bot Maintainer" }]
dependencies = [
  "openai>=1.68,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
fpl-bot = "fpl_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_bot"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fpl_bot"]
