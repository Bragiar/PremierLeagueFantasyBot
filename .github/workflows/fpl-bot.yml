name: FPL recommendation bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and record a plan without sending Telegram
        required: true
        default: true
        type: boolean
      force:
        description: Run outside a deadline window (non-dry-run can send immediately)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fpl-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bot
        run: python -m pip install .

      - name: Check deadline and create recommendation
        id: bot
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run --force)
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          python -m fpl_bot "${args[@]}"

      - name: Commit decision artifacts
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- logs/decision_log.jsonl state/last_run.json state/rolling_plan.json outputs/latest_recommendation.md outputs/latest_strategy_plan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(fpl): record recommendation [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report bot failure after saving diagnostics
        if: steps.bot.outcome == 'failure'
        run: exit 1
